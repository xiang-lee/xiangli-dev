<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>都柏林周末亲子 | 爱尔兰周末</title>
    <meta
      name="description"
      content="给爱尔兰华人爸妈的都柏林周末亲子清单：四区图书馆、博物馆和家庭景点，可按地区、本周末或下周末、免费或收费筛选。"
    />
    <link rel="canonical" href="https://xiangli.dev/weekend/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="都柏林周末亲子" />
    <meta
      property="og:description"
      content="中文整理的都柏林四区家庭周末活动。图书馆故事会、手工，以及博物馆和景点。"
    />
    <meta property="og:url" content="https://xiangli.dev/weekend/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="都柏林周末亲子" />
    <meta
      name="twitter:description"
      content="中文整理的都柏林四区家庭周末活动。"
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-init.js"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <a class="skip-link" href="#main">跳到活动列表</a>
    <header class="site-header">
      <div class="container header-bar">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true">周</span>
          <span>
            <span class="brand-kicker">爱尔兰周末</span>
            <span class="brand-name">都柏林亲子</span>
          </span>
        </a>
        <div class="header-actions">
          <a class="text-link" href="../">xiangli.dev</a>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深色或浅色">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="container hero">
        <p class="eyebrow">都柏林都会区 · 给华人爸妈</p>
        <h1>这个周末，带孩子去哪儿？</h1>
        <p class="lede">
          中文整理的家庭周末清单，只覆盖都柏林四区：市里、南都柏林、邓莱里-拉思当和芬戈尔。免费图书馆场次和要买票的博物馆、动物园放在一起，先筛再出门。
        </p>
      </section>

      <section class="container">
        <form id="filters" class="filters" action="#" autocomplete="off">
          <div class="filter-block">
            <div class="filter-label" id="region-label">地区</div>
            <div class="chip-row" id="region-filters" role="group" aria-labelledby="region-label">
              <button class="chip" type="button" data-region="all" aria-pressed="true">全部</button>
              <button class="chip" type="button" data-region="dublin-city" aria-pressed="false">都柏林市</button>
              <button class="chip" type="button" data-region="south-dublin" aria-pressed="false">南都柏林</button>
              <button class="chip" type="button" data-region="dlr" aria-pressed="false">邓莱里-拉思当</button>
              <button class="chip" type="button" data-region="fingal" aria-pressed="false">芬戈尔</button>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-label" id="when-label">日期</div>
            <div class="chip-row" id="when-filters" role="group" aria-labelledby="when-label">
              <button class="chip" type="button" data-when="this" aria-pressed="true">本周末</button>
              <button class="chip" type="button" data-when="next" aria-pressed="false">下周末</button>
              <button class="chip" type="button" data-when="custom" aria-pressed="false">自定义</button>
              <button class="chip" type="button" data-when="all" aria-pressed="false">全部日期</button>
            </div>
            <p id="when-caption" class="caption"></p>
            <div id="custom-range" class="custom-range" hidden>
              <label class="date-field" for="date-from">
                从
                <input id="date-from" type="date" name="from" />
              </label>
              <label class="date-field" for="date-to">
                到
                <input id="date-to" type="date" name="to" />
              </label>
            </div>
            <p id="range-error" class="range-error" hidden>开始日期晚于结束日期。</p>
          </div>

          <div class="filter-split">
            <div class="filter-block">
              <div class="filter-label" id="price-label">费用</div>
              <div class="chip-row" id="price-filters" role="group" aria-labelledby="price-label">
                <button class="chip" type="button" data-price="all" aria-pressed="true">全部</button>
                <button class="chip" type="button" data-price="free" aria-pressed="false">免费</button>
                <button class="chip" type="button" data-price="paid" aria-pressed="false">收费</button>
              </div>
            </div>
            <div class="filter-tools">
              <label class="search-field" for="search">
                <span>搜索</span>
                <input id="search" type="search" name="q" placeholder="故事会、动物园、塔拉…" enterkeyhint="search" />
              </label>
              <label class="sort-field" for="sort">
                <span>排序</span>
                <select id="sort" name="sort">
                  <option value="time">按时间</option>
                  <option value="free">免费优先</option>
                </select>
              </label>
            </div>
          </div>
        </form>

        <div id="notice" class="notice" hidden></div>
        <p id="result-count" class="result-count" aria-live="polite">正在整理活动…</p>
        <div id="event-list" class="event-grid"></div>
        <div id="empty-state" class="empty" hidden>
          <p id="empty-text">这个条件下没有活动。</p>
          <button id="reset-filters" class="chip chip-solid" type="button">查看全部活动</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          这些是为 MVP 整理的策展样本，不是实时票务。活动可能改期、满员或已经结束。出发前请打开每条里的「查看来源」，核对时间、年龄、是否需要预约以及票价。
        </p>
        <p class="footer-links">
          <a href="../">返回 xiangli.dev</a>
          <span aria-hidden="true">·</span>
          <span>都柏林四区 · 静态清单</span>
        </p>
      </div>
    </footer>
    <noscript>
      <p class="noscript">筛选和活动卡片需要 JavaScript。本页脚本只在本站加载，不请求第三方接口。</p>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
